name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint shell scripts and workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck-alpine:stable \
            shellcheck ./*.sh

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from the compose file's x-images defaults at
      # runtime — single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: beszel
            env_var: BESZEL_IMAGE_TAG
          - name: agent
            env_var: BESZEL_AGENT_IMAGE_TAG
          - name: dockerproxy
            env_var: BESZEL_DOCKERPROXY_IMAGE_TAG
          - name: backups
            env_var: BESZEL_BACKUPS_IMAGE_TAG
          - name: traefik
            env_var: TRAEFIK_IMAGE_TAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -m1 -oE "\\$\\{${ENV_VAR}:-.*" beszel-traefik-letsencrypt-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # FINDINGS DO NOT FAIL THIS STEP; A SCAN THAT CANNOT FINISH DOES.
          # Stated here rather than left to the action's default, because
          # this job no longer carries continue-on-error and the difference
          # now decides whether a red run means a new CVE upstream or a
          # scanner that died before it could report one.
          exit-code: "0"

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  deploy-and-test:
    name: docker compose up + registration path and socket isolation + backup validity
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 35
    permissions:
      contents: read

    env:
      NETWORK_ONE: beszel-network
      NETWORK_TWO: traefik-network
      DOCKER_COMPOSE_FILE: beszel-traefik-letsencrypt-docker-compose.yml
      APP_HOSTNAME: beszel.heyvaldemardm.net
      APP_TRAEFIK_HOSTNAME: traefik.beszel.heyvaldemardm.net
      COMPOSE_PROJECT_NAME: beszel

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create necessary Docker networks
        run: |
          docker network create "$NETWORK_ONE" || true
          docker network create "$NETWORK_TWO" || true

      - name: Generate test .env with ephemeral credentials
        # The real .env is gitignored. CI generates throwaway credentials so
        # `docker compose up` succeeds without committing secrets to the
        # repo. No *_IMAGE_TAG values on purpose: the compose file's
        # x-images defaults apply, so CI always tests exactly the pins the
        # template ships to users who run it unmodified.
        run: |
          cat > .env <<EOF
          TRAEFIK_ACME_EMAIL=ci@example.com
          TRAEFIK_HOSTNAME=${APP_TRAEFIK_HOSTNAME}
          TRAEFIK_BASIC_AUTH=traefikadmin:\$\$2y\$\$10\$\$sMzJfirKC75x/hVpiINeZOiSm.Jkity9cn4KwNkRvO7hSQVFc5FLO
          BESZEL_HOSTNAME=${APP_HOSTNAME}
          BACKUP_INIT_SLEEP=15s
          BACKUP_INTERVAL=60s
          EOF
          echo "Generated ephemeral .env for CI run"

      - name: Upgrade drill — the previous release comes up first, on the volumes this run will upgrade
        # A fresh stack proves the new image starts. It proves nothing about the
        # data a deployed host already has: whether the new database image accepts
        # the old data directory, whether the application's migrations run on a
        # populated schema. So the previous release is started first, on this
        # project's volumes, and the ordinary `up -d` below then recreates the
        # changed containers on top of it - which is exactly what `git pull &&
        # docker compose up -d` does on a deployed host. Every smoke check that
        # follows judges the upgraded stack, not a fresh one.
        run: |
          prev="$(git ls-remote --tags --sort=-v:refname origin 'v*' | grep -v '\^{}' | head -1 | sed 's|.*refs/tags/||')"
          if [ -z "$prev" ]; then
            echo "no previous release: nothing to upgrade from, the fresh start below is the whole test"
            exit 0
          fi
          git fetch --depth=1 --quiet origin "refs/tags/$prev:refs/tags/$prev"
          if git diff --quiet "$prev" -- "$DOCKER_COMPOSE_FILE"; then
            echo "the compose file is unchanged since $prev: nothing to drill"
            exit 0
          fi
          git show "$prev:$DOCKER_COMPOSE_FILE" > .upgrade-drill-previous.yml
          echo "starting $prev on this project's volumes"
          docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" up -d
          # Healthy means: every container is running and healthy (or running
          # with no health check), or exited 0 (a one-shot init container).
          #
          # EXCEPT THE AGENT, which this template documents as crash-looping
          # until the hub issues it a key: .env.example ships BESZEL_AGENT_KEY
          # empty on purpose, and a smoke check below asserts the agent is
          # failing for that exact reason and no other. The drill had no such
          # exemption, so it read "beszel-agent:restarting" as "the previous
          # release did not come up" and failed every time. Every pin refresh
          # since v1.0.0 was reverted by fleet triage on the strength of it,
          # and this repository could not be updated at all.
          bad=""
          for _ in $(seq 1 60); do
            bad="$(docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" ps -a --format json \
              | jq -rs '[.[] | select(.Service != "beszel-agent") | select((.State == "running" and (.Health == "" or .Health == "healthy")) or (.State == "exited" and .ExitCode == 0) | not)] | map("\(.Service):\(.State)/\(.Health)") | join(" ")')"
            [ -z "$bad" ] && break
            sleep 10
          done
          if [ -n "$bad" ]; then
            echo "::error::the previous release ($prev) did not come up with this run's .env: $bad. Either the variable contract changed - then the changelog must say so - or $prev was never green here."
            docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" logs --tail 80
            exit 1
          fi
          echo "$prev is up and healthy; stopping it and keeping its volumes"
          docker compose -f .upgrade-drill-previous.yml -p "$COMPOSE_PROJECT_NAME" down
          rm -f .upgrade-drill-previous.yml
          echo "the start below is now an upgrade from $prev"

      - name: Start up services using Docker Compose
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" up -d

      - name: Modify /etc/hosts for internal routing
        run: |
          echo "127.0.0.1 $APP_HOSTNAME" | sudo tee -a /etc/hosts
          echo "127.0.0.1 $APP_TRAEFIK_HOSTNAME" | sudo tee -a /etc/hosts

      - name: Print Docker Compose services status
        run: docker ps

      - name: Wait for the hub through Traefik
        run: |
          # shellcheck disable=SC2016
          timeout 8m bash -c 'while ! curl -sk "https://$APP_HOSTNAME/api/health" | grep -q "API is healthy"; do
            echo "Waiting for the hub..."
            sleep 10
          done'
          curl -sk "https://$APP_HOSTNAME/api/health" -w "\n"

      - name: The agent fails in exactly the documented way, and no other
        # The README tells you the agent crash-loops until you give it a key
        # issued by the hub, and that this is expected rather than broken. That
        # is a claim, and an unchecked claim about an expected failure is how a
        # genuinely broken agent goes unnoticed for a week: a container
        # restarting is exactly what the reader has been told to ignore.
        #
        # So the message is asserted. If the agent ever fails for a different
        # reason - a bad mount, a missing socket directory, an image that
        # changed its flags - this catches it while it still looks like the
        # same symptom.
        run: |
          dc() { docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" "$@"; }
          # shellcheck disable=SC2016
          timeout 3m bash -c 'until docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs beszel-agent 2>/dev/null | grep -q .; do sleep 5; done'
          dc logs beszel-agent | tail -3
          dc logs beszel-agent | grep -q "no key provided" \
            || { echo "::error::the agent is failing for a reason other than the missing key this template documents"; dc logs beszel-agent | tail -20; exit 1; }
          echo "the agent is waiting for a key, which is what the README says it does"

      - name: The registration path the README describes actually exists
        # Everything a new deployment has to do before the agent can start, done
        # here so the instructions cannot quietly stop being true: create an
        # account from the CLI, sign in to the API with it, and read back the
        # public key that goes in KEY. The per-system TOKEN is minted by the
        # interface when you add a system and cannot be fabricated from the
        # outside - which is why the README sends you there for it rather than
        # pretending otherwise.
        run: |
          dc() { docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" "$@"; }
          dc exec -T beszel /beszel superuser upsert ci@example.com "ci-test-password-123"
          tok=$(curl -sk -X POST -H "Content-Type: application/json" \
            -d '{"identity":"ci@example.com","password":"ci-test-password-123"}' \
            "https://$APP_HOSTNAME/api/collections/_superusers/auth-with-password" | jq -r '.token // empty')
          [ -n "$tok" ] || { echo "::error::the account created from the CLI cannot sign in to the API"; exit 1; }
          echo "an account created from the CLI signs in to the API"
          key=$(curl -sk -H "Authorization: $tok" "https://$APP_HOSTNAME/api/beszel/getkey" | jq -r '.key // empty')
          echo "agent key: ${key%% *} …"
          case "$key" in
            ssh-*) echo "the hub hands out the public key the agent needs" ;;
            *) echo "::error::/api/beszel/getkey did not return an ssh key: ${key:-nothing}"; exit 1 ;;
          esac

      - name: Neither the hub nor the agent has the Docker socket
        run: |
          dc() { docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" "$@"; }
          for svc in beszel beszel-agent; do
            mounts=$(docker inspect "$(dc ps -aq $svc | head -1)" --format '{{range .Mounts}}{{.Source}} {{end}}')
            echo "$svc mounts: $mounts"
            case "$mounts" in
              *docker.sock*) echo "::error::$svc has the Docker socket mounted"; exit 1 ;;
            esac
          done
          echo "neither container has a Docker socket"
          probe() {
            dc exec -T backups sh -c "wget -q -O /dev/null -S $1 2>&1" \
              | grep -m1 -oE 'HTTP/[0-9.]+ [0-9]+' | grep -oE '[0-9]+$' || true
          }
          write=$(probe '--post-data "" "http://dockerproxy:2375/containers/nonexistent/restart"')
          read=$(probe '"http://dockerproxy:2375/containers/json"')
          echo "through the proxy: POST restart -> ${write:-no answer}, GET containers/json -> ${read:-no answer}"
          [ "$write" = "403" ] || { echo "::error::the proxy answered ${write:-nothing} to a POST; it is not read-only"; exit 1; }
          [ "$read" = "200" ] || { echo "::error::the proxy answered ${read:-nothing} to a GET; the agent cannot see containers"; exit 1; }
          echo "the daemon is readable and not writable through the proxy"

      - name: The agent image is the one that can read S.M.A.R.T.
        # The default agent image is built FROM scratch: no shell, no smartctl,
        # and therefore no disk health at all - it runs happily and silently
        # monitors nothing. The pin says -alpine; this is what makes that pin a
        # requirement rather than a preference.
        run: |
          dc() { docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" "$@"; }
          image=$(docker inspect "$(dc ps -aq beszel-agent | head -1)" --format '{{.Config.Image}}')
          echo "agent image: $image"
          case "$image" in
            *-alpine@*|*-alpine) ;;
            *) echo "::error::the agent is not the -alpine variant; S.M.A.R.T. would silently monitor nothing"; exit 1 ;;
          esac
          docker run --rm --entrypoint sh "$image" -c 'command -v smartctl' \
            || { echo "::error::the pinned agent image has no smartctl"; exit 1; }
          echo "the pinned agent image carries smartctl"

      - name: Verify a backup is produced and valid
        # Log-driven: the file named in a 'backup OK' line has already been
        # read back by the loop itself, so this never races a cycle that is
        # still writing.
        run: |
          # shellcheck disable=SC2016
          timeout 6m bash -c 'until docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep -q "Data backup OK"; do echo "Waiting for the first backup cycle..."; sleep 10; done'
          data=$(docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep "Data backup OK" | tail -1 | sed -E 's/.*Data backup OK: ([^ ]+) .*/\1/')
          [ -n "$data" ] || { echo "::error::no 'Data backup OK' line - the archive failed"; exit 1; }
          echo "Data backup file: $data"
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" exec -T backups sh -c "tar -tzf '$data' > /dev/null && tar -tzf '$data' | grep -q '^config/'" \
            && echo "Data backup valid and carries the data directory: $data"
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs backups 2>/dev/null | grep -i "backup FAILED" && { echo "::error::the backups log reports a failure"; exit 1; } || true

      - name: Run the backup/restore end-to-end tests
        # Eight scenarios against the live stack: required-env guard, backup
        # produced, readable, valid content, library archive readable, failure
        # detected when the database is down, restore genuinely replaces state,
        # prune keeps recent files. Same script a maintainer runs locally.
        run: |
          chmod +x tests/e2e-backup-restore.sh
          ./tests/e2e-backup-restore.sh

      - name: The hub comes back on the restored data directory
        run: |
          docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" restart beszel
          # shellcheck disable=SC2016
          timeout 6m bash -c 'while ! curl -sk "https://$APP_HOSTNAME/api/health" | grep -q "API is healthy"; do
            echo "Waiting for the hub on the restored data..."
            sleep 10
          done'
          echo "the hub came back on the restored data directory"

      - name: Wait for the Traefik dashboard to be ready
        run: |
          # shellcheck disable=SC2016
          timeout 5m bash -c 'while ! curl -fsSLk --write-out "%{http_code}" --output /dev/null "https://$APP_TRAEFIK_HOSTNAME" | grep -E "200|401"; do
            echo "Waiting for the dashboard to be ready..."
            sleep 10
          done'

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" logs

      - name: Shutdown Docker Compose services
        if: always()
        run: docker compose -f "$DOCKER_COMPOSE_FILE" -p "$COMPOSE_PROJECT_NAME" down
